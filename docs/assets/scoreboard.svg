<svg xmlns="http://www.w3.org/2000/svg" width="800" height="312" viewBox="0 0 800 312" role="img" aria-label="Honest scoreboard: in-domain AUROC about 0.8 on IndEgo versus out-of-domain AUROC about 0.6 on factory footage, with confidence intervals">
  <rect x="0" y="0" width="800" height="312" rx="12" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">The honest scoreboard</text>
  <text x="24" y="52" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569">AUROC with 95% CI · dashed line = chance (0.5) · CIs bootstrap windows, optimistic · linear axis 0.3–1.0</text>
  <!-- axis: single linear scale 0.3 to 1.0 -->
  <line x1="290" y1="70" x2="290" y2="254" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="290" y1="254" x2="770" y2="254" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="427.1" y1="70" x2="427.1" y2="254" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="278" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">0.3</text>
  <text x="415" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">0.5</text>
  <text x="552" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">0.7</text>
  <text x="758" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">1.0</text>
  <text x="24" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">in-domain · ensemble — gates not met</text>
  <text x="24" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">IndEgo · n=150 · 7 clips</text>
  <g>
    <line x1="574.6" y1="104" x2="711.0" y2="104" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <rect x="611.2" y="94" width="90" height="20" rx="5" fill="#0ea5e9"/>
    <text x="618.2" y="108" font-family="monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">0.834</text>
  </g>
  <text x="24" y="144" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">in-domain · S1 head</text>
  <text x="24" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">IndEgo · n=150</text>
  <g>
    <line x1="571.1" y1="150" x2="680.9" y2="150" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="589.2" y="140" width="90" height="20" rx="5" fill="#334155"/>
    <text x="596.2" y="154" font-family="monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">0.802</text>
  </g>
  <text x="24" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">out-of-domain · cascade</text>
  <text x="24" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">factories · n=160 · 47 sites · sync doc; file pending</text>
  <g>
    <line x1="409.3" y1="196" x2="580.7" y2="196" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <rect x="450.7" y="186" width="90" height="20" rx="5" fill="#f59e0b"/>
    <text x="457.7" y="200" font-family="monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">0.600</text>
  </g>
  <text x="24" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">out-of-domain · ensemble</text>
  <text x="24" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">factories · n=160 · sync doc; file pending</text>
  <g>
    <line x1="381.2" y1="240" x2="559.5" y2="240" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <rect x="427.4" y="230" width="90" height="20" rx="5" fill="#94a3b8"/>
    <text x="434.4" y="244" font-family="monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">0.566</text>
  </g>
  <text x="24" y="296" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Scores above chance in-domain on 7 clips (exploratory; weakest clip 0.606). Factory transfer is the open problem.</text>
</svg>
